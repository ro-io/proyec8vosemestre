<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — IDE</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="auth-page">

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-icon" id="modalIcon">✓</div>
      <h3 class="modal-title" id="modalTitle">¡Éxito!</h3>
      <p class="modal-msg" id="modalMsg">Operación completada.</p>
      <button class="modal-btn" id="modalBtn">Aceptar</button>
    </div>
  </div>

  <!-- NAVBAR -->
  <nav class="navbar scrolled" id="navbar">
    <a href="index.html" class="nav-logo">
      <span class="logo-acronym">IDE</span>
      <span class="logo-divider">|</span>
      <span class="logo-full">Ingeniería Digital Empresarial</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">← Volver al inicio</a></li>
      <li><a href="registro.html" class="nav-register">Registrarse</a></li>
      <li><a href="login.html" class="nav-login">Login</a></li>
    </ul>
  </nav>

  <!-- CONTENIDO -->
  <main class="auth-main">
    <div class="auth-left">
      <div class="auth-brand">
        <span class="auth-acronym">IDE</span>
        <p class="auth-tagline">Desarrollamos <em>hoy</em><br/>lo que necesitas mañana.</p>
      </div>
      <div class="auth-deco">IDE</div>
    </div>

    <div class="auth-right">
      <div class="auth-card">
        <div class="auth-header">
          <p class="auth-label">Bienvenido de vuelta</p>
          <h1 class="auth-title">Iniciar <em>sesión</em></h1>
          <p class="auth-sub">Accede al portal de seguimiento de tus proyectos.</p>
        </div>

        <form class="auth-form" id="loginForm">
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required/>
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-password">
              <input type="password" id="password" name="password" placeholder="Tu contraseña" required/>
              <button type="button" class="toggle-pass" id="togglePass">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-auth">
            <span>Ingresar</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
          <div class="auth-error" id="authError"></div>
        </form>

        <p class="auth-switch">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
